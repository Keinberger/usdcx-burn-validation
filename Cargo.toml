[package]
name = "usdcx-burn-validation"
version = "0.1.0"
edition = "2021"
publish = false
description = "Validates a USDCx burn note on Miden with the decoder the faucet's own code uses"

[lib]
path = "src/lib.rs"

[[bin]]
name = "validate-burn"
path = "src/main.rs"

# The three Miden crates are pinned to the final head of 0xMiden/protocol PR 3983 (merged into
# next on 2026-10-01), the commit this crate was validated against (workspace version 0.17.0-rc.9).
# The published `miden-usdcx` 0.17.0-rc.9 on crates.io carries the same version string but the v16
# format; do not substitute it. Once a release that includes the PR exists, replace the three lines
# with that version.
[dependencies]
miden-protocol  = { git = "https://github.com/0xMiden/protocol", rev = "372a8f7090faf2c6bd25ba41dff4a0053e9d4300" }
miden-standards = { git = "https://github.com/0xMiden/protocol", rev = "372a8f7090faf2c6bd25ba41dff4a0053e9d4300" }
miden-usdcx     = { git = "https://github.com/0xMiden/protocol", rev = "372a8f7090faf2c6bd25ba41dff4a0053e9d4300" }
hex = "0.4"
thiserror = "2"

[dev-dependencies]
anyhow = "1"
# `AccountId::dummy` for deterministic test ids
miden-protocol = { git = "https://github.com/0xMiden/protocol", rev = "372a8f7090faf2c6bd25ba41dff4a0053e9d4300", features = ["testing"] }
# the golden burn vectors used by the tests are behind the `testing` feature
miden-usdcx = { git = "https://github.com/0xMiden/protocol", rev = "372a8f7090faf2c6bd25ba41dff4a0053e9d4300", features = ["testing"] }
